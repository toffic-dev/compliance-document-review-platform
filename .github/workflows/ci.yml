name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create dummy .env for validation
        run: cp .env.example .env

      - name: Validate docker-compose config
        run: docker compose config

      - name: Start the database and wait for it to be healthy
        run: docker compose up -d --wait db

      - name: Tear down
        if: always()
        run: docker compose down -v

      # TODO once other repos exist as siblings:
      # - Check out backend/frontend/ai repos too (or use a matrix)
      # - Run ./scripts/seed.sh
      # - Run each track's test suite (docker compose exec ...)
