name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create dummy .env for validation
        run: cp .env.example .env

      - name: Validate docker-compose config
        run: docker compose config
