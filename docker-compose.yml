# Assumes this repo is cloned side-by-side with the other track repos:
#
#   compliance-review/
#   - compliance-document-review-app/            <- Backend (Petros/pbekana)
#   - compliance-document-review-ai/
#   - compliance-document-review-data-engineering/  <- Data eng (Sushma)
#   - compliance-document-review-platform/       <- this repo
#
# Frontend (compliance-document-review-frontend) is deployed separately via
# Vercel, not run through docker-compose - see INTEGRATION.md.
#
# If your team's repo names differ, update the `context` paths below to match.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: compliance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compliance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compliance}
      POSTGRES_DB: ${POSTGRES_DB:-compliance_review}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compliance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../compliance-document-review-app/Backend
    container_name: compliance-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-compliance}:${POSTGRES_PASSWORD:-compliance}@db:5432/${POSTGRES_DB:-compliance_review}
      PORT: ${BACKEND_PORT:-8000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy

  ai:
    build:
      context: ../compliance-document-review-ai
    container_name: compliance-ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-compliance}:${POSTGRES_PASSWORD:-compliance}@db:5432/${POSTGRES_DB:-compliance_review}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      PORT: ${AI_PORT:-8001}
    ports:
      - "${AI_PORT:-8001}:${AI_PORT:-8001}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
